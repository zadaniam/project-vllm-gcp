name: Deploy Backend to GCE

on:
  push:
    branches:
      - main  # Memicu otomatisasi hanya saat Anda push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Masuk ke GCE via SSH dan Update Kode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}          # IP Publik VM e2-micro Anda
          username: ${{ secrets.GCE_USERNAME }}  # Username SSH Anda (zadaniammusthofa)
          key: ${{ secrets.GCE_SSH_KEY }}        # Private SSH Key Anda
          port: 22
          script: |
            # Masuk ke folder proyek di server GCE
            cd ~/backend-utama
            
            # Tarik kode terbaru dari GitHub
            git pull origin main
            
            # Aktifkan virtual environment dan pastikan dependensi terupdate
            source venv/bin/activate
            pip install -r requirements.txt --upgrade
            
            # Matikan proses backend lama jika sedang berjalan
            pkill -f failover.py || true
            
            # SOLUSI: Menginjeksikan API KEY secara langsung saat menjalankan nohup
            export GOOGLE_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export DEBUG_MODE="True"
          
            # PERBAIKAN: Gunakan flag -u agar log eror langsung ditulis saat itu juga
            nohup python -u failover.py > backend.log 2>&1 &

            # PERBAIKAN: Beri jeda 3 detik, lalu cek apakah prosesnya masih hidup
            sleep 3
            if ps aux | grep -v grep | grep "failover.py" > /dev/null
            then
                echo "🚀 Deployment Berhasil dan Backend berjalan dengan aman!"
            else
                echo "❌ ERROR: Backend gagal dinyalakan! Isi backend.log:"
                cat backend.log
                exit 1
            fi
